<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Travel Assistant MVP</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 15px; }
    #chat-box { border: 1px solid #ccc; padding: 15px; height: 300px; overflow-y: auto; margin-bottom: 10px; background: #f9f9f9; }
    .msg { margin: 8px 0; padding: 8px; border-radius: 6px; }
    .user { background: #e3f2fd; color: #0d47a1; }
    .bot { background: #f5f5f5; color: #212121; }
    input[type="text"] { width: 70%; padding: 10px; }
    button { padding: 10px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Travel Assistant (MVP)</h1>
  <div id="chat-box"></div>
  <div>
    <input type="text" id="user-input" placeholder="Что хочешь узнать про путешествие?" />
    <button onclick="sendMessage()">Отправить</button>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage('user', text);
      userInput.value = '';

      try {
        const response = await fetch('https://travel-assistant-backend-z9tr.onrender.com/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            message: text,
            history: [],
            model: 'llama-3.2-1b-instruct'
          }),
          signal: AbortSignal.timeout(90000)
        });

        if (!response.ok) {
          throw new Error(`Ошибка сервера: ${response.status}`);
        }

        const data = await response.json();
        addMessage('bot', data.message || 'Нет ответа от ассистента.');
      } catch (err) {
        console.error(err);
        let msg = 'Ошибка: не удалось получить ответ.';
        if (err.name === 'TimeoutError') {
          msg += ' Сервер Render «спал» и не успел ответить. Попробуй ещё раз через минуту.';
        }
        addMessage('bot', msg);
      }
    }

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
